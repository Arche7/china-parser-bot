<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07080A">
<title>HUNTR</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07080A;--lime:#D4FF3A;--lime2:#E8FF8A;--ink:#0A0B0A;--text:#F2F4EF;--muted:#8D928A;--muted2:#A9AEA6;--soft:#C4C9C1;
  --sheet:#0E100E;--line:rgba(255,255,255,.10);--chip:rgba(255,255,255,.07);
  --warn:#FFC94A;--bad:#FF6B5A;
  --top:calc(var(--tg-content-safe-area-inset-top,0px) + var(--tg-safe-area-inset-top,0px) + env(safe-area-inset-top,0px));
  --bottom:max(env(safe-area-inset-bottom,0px),var(--tg-safe-area-inset-bottom,0px));
  --display:'Unbounded',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:'Manrope',system-ui,sans-serif;font-size:15px;overflow:hidden;overscroll-behavior:none}
a{color:var(--lime)}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0;font-size:inherit}
button:disabled{cursor:default;opacity:.45}
input{font-family:inherit}
:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
.disp{font-family:var(--display)}
.scroll{overflow-y:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.scroll::-webkit-scrollbar{display:none}
.glass{background:linear-gradient(160deg,rgba(255,255,255,.09),rgba(255,255,255,.025));border:1px solid rgba(255,255,255,.10);box-shadow:inset 0 1px 0 rgba(255,255,255,.14);-webkit-backdrop-filter:blur(22px) saturate(160%);backdrop-filter:blur(22px) saturate(160%)}
.press{transition:transform .18s cubic-bezier(.2,.8,.2,1),background .2s,opacity .2s,color .2s}
.press:active{transform:scale(.96)}
.rise{animation:rise .55s cubic-bezier(.2,.8,.2,1) both}
.screen{animation:screen .42s cubic-bezier(.2,.8,.2,1) both}
.back{animation:fade .3s ease both}
.sheet{animation:sheet .48s cubic-bezier(.16,1,.3,1) both}
.closing .back{animation:fadeout .26s ease both}
.closing .sheet{animation:sheetout .26s cubic-bezier(.4,0,1,1) both}
.toast{animation:toast 2.2s cubic-bezier(.2,.8,.2,1) both}
.shimmer{background:linear-gradient(90deg,rgba(255,255,255,.04),rgba(212,255,58,.18),rgba(255,255,255,.04));background-size:200% 100%;animation:shimmer 1.1s linear infinite}
.skel{background:linear-gradient(90deg,rgba(255,255,255,.04),rgba(255,255,255,.09),rgba(255,255,255,.04));background-size:200% 100%;animation:shimmer 1.3s linear infinite}
.live{animation:live 1.6s ease-in-out infinite}
.sweep{animation:spin 3.2s linear infinite}
.splash.exit{animation:splashout .42s cubic-bezier(.6,0,.3,1) both}
.s-br{opacity:0;animation:snap .38s cubic-bezier(.2,1.2,.3,1) forwards}
.s-b1{--x:-26px;--y:-26px}.s-b2{--x:26px;--y:-26px}.s-b3{--x:26px;--y:26px}.s-b4{--x:-26px;--y:26px}
.s-h{transform-box:fill-box;transform-origin:50% 100%;opacity:0;transform:scaleY(.55);animation:hrise .45s .2s cubic-bezier(.2,1.3,.4,1) forwards}
.s-dot{transform-box:fill-box;transform-origin:50% 50%;transform:scale(0);animation:pop .35s .5s cubic-bezier(.2,1.7,.4,1) forwards}
.s-pulse{transform-box:fill-box;transform-origin:50% 50%;opacity:0;animation:pulse .8s .62s ease-out forwards}
.s-glow{opacity:0;transform:scale(.7);animation:glow .9s .15s cubic-bezier(.2,.8,.2,1) forwards}
.s-letter{display:inline-block;opacity:0;transform:translateY(12px);animation:letter .4s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes screen{from{opacity:0;transform:translateY(10px) scale(.99)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes fadeout{to{opacity:0}}
@keyframes sheet{from{transform:translateY(100%)}to{transform:none}}
@keyframes sheetout{to{transform:translateY(100%)}}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-12px)}10%{opacity:1;transform:translate(-50%,0)}86%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-8px)}}
@keyframes shimmer{to{background-position:-200% 0}}
@keyframes live{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(212,255,58,.6)}50%{opacity:.75;box-shadow:0 0 0 6px rgba(212,255,58,0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes splashout{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.08);filter:blur(4px)}}
@keyframes snap{from{opacity:0;transform:translate(var(--x),var(--y))}to{opacity:1;transform:none}}
@keyframes hrise{to{opacity:1;transform:none}}
@keyframes pop{to{transform:scale(1)}}
@keyframes pulse{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(5)}}
@keyframes glow{to{opacity:1;transform:scale(1)}}
@keyframes letter{to{opacity:1;transform:none;filter:none}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms !important;animation-delay:0s !important;animation-iteration-count:1 !important;transition:none !important}}

/* каркас */
#stage{position:fixed;inset:0;max-width:480px;margin:0 auto;overflow:hidden;overflow:clip;background:var(--bg)}
.bg-glow{position:absolute;width:520px;height:520px;right:-220px;top:-220px;border-radius:50%;background:radial-gradient(circle,rgba(212,255,58,.20),rgba(212,255,58,0) 65%);pointer-events:none}
.bg-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:32px 32px;pointer-events:none}
#view{position:absolute;inset:0;padding:calc(var(--top) + 18px) 18px 0;overflow-x:hidden}
.col.main::after{content:'';display:block;flex:none;height:calc(var(--bottom) + 86px)}
.col{display:flex;flex-direction:column;gap:16px}
.h1{font-family:var(--display);font-weight:700;font-size:28px;letter-spacing:-.02em;margin:0}
.sub{font-size:13px;color:var(--muted);font-weight:600}
.txt{font-size:14px;color:var(--muted2);line-height:1.45}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.logo{display:flex;align-items:center;gap:10px}
.logo b{font-family:var(--display);font-weight:800;font-size:17px;letter-spacing:.2em}
.livepill{height:36px;padding:0 14px;border-radius:999px;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:var(--lime)}
.dot.off{background:#6A6F68;animation:none}
.hero{font-family:var(--display);font-weight:700;font-size:30px;line-height:1.08;letter-spacing:-.02em;margin-top:6px}
.hero span{color:var(--lime)}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -18px;padding:2px 18px}
.chip{flex:none;height:38px;padding:0 15px;border-radius:999px;font-size:13px;font-weight:700;white-space:nowrap;background:var(--chip);border:1px solid var(--line);display:inline-flex;align-items:center;gap:6px}
.chip small{font-size:11px;opacity:.6;font-weight:800}
.chip.on{background:var(--lime);color:var(--ink);border-color:var(--lime)}
.chip.on small{opacity:.7}
.chip.done{color:var(--lime);border-color:rgba(212,255,58,.4);background:rgba(212,255,58,.08)}
.wrapchips{display:flex;flex-wrap:wrap;gap:8px}

/* карточка вещи */
.card{position:relative;width:100%;height:104px;text-align:left;border-radius:20px;padding:10px;display:flex;gap:12px;align-items:center}
.thumb{position:relative;width:84px;height:84px;flex:none;border-radius:14px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.thumb img,.photo img,.gph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.udot{position:absolute;right:12px;top:12px;width:8px;height:8px;border-radius:50%;background:var(--lime);box-shadow:0 0 0 3px rgba(212,255,58,.15),0 0 10px rgba(212,255,58,.6);transition:opacity .4s,transform .4s;z-index:2}
.udot.out{opacity:0;transform:scale(.3)}
.cbody{flex:1;min-width:0;display:flex;flex-direction:column}
.cbrand{font-weight:800;font-size:15px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:14px}
.cfav{color:var(--lime);display:inline-flex;vertical-align:-1px;margin-right:5px}
.ctitle{font-size:13px;color:var(--muted2);line-height:1.3;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ccity{font-size:12px;color:var(--muted);line-height:1.3;min-height:16px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cprice{display:flex;align-items:baseline;gap:7px;margin-top:6px;min-width:0;white-space:nowrap}
.cny{font-family:var(--display);font-weight:700;font-size:16px}
.rub{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.cchip{margin-left:auto;flex:none;max-width:42%;overflow:hidden;text-overflow:ellipsis;font-size:11px;font-weight:700;padding:3px 7px;border-radius:7px;background:rgba(255,255,255,.08);color:var(--muted2);align-self:center;white-space:nowrap}
.cchip.bad{background:rgba(255,107,90,.16);color:var(--bad)}
.gone{opacity:.45}
.flist{display:flex;flex-direction:column;gap:8px}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.gcard{position:relative;display:block;width:100%;min-width:0;border-radius:20px;padding:6px;text-align:left}
.gph{position:relative;aspect-ratio:1/1;border-radius:15px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.gph .cchip{position:absolute;left:8px;top:8px;margin:0;z-index:1;background:rgba(20,8,6,.7)}
.gcard .udot{right:14px;top:14px}
.gb{font-weight:800;font-size:13px;margin:7px 4px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gp{display:flex;align-items:baseline;gap:6px;margin:1px 4px 4px;white-space:nowrap;overflow:hidden}
.gp .cny{font-size:14px}.gp .rub{font-size:11px}
.dsec{display:flex;flex-direction:column;gap:8px}
.dayh{position:sticky;top:8px;z-index:3;align-self:flex-start;width:max-content;margin:2px 0 -2px;padding:7px 12px;border-radius:999px;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--soft);background:rgba(14,16,14,.78);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);box-shadow:0 6px 18px rgba(0,0,0,.35)}
.dayh b{color:var(--lime)}
.dayh b{color:var(--soft)}
.fsum{font-size:13px;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fsum b{color:var(--lime);font-weight:800}
.vbtn{width:48px;height:48px;flex:none;border-radius:16px;display:flex;align-items:center;justify-content:center;color:var(--soft)}
.lbtn{font-size:12px;font-weight:800;color:var(--lime);min-height:30px;padding:0 2px}
.pills{display:flex;gap:6px;margin-top:8px;align-items:center;flex-wrap:wrap}
.pill{font-size:12px;font-weight:700;padding:5px 8px;border-radius:8px;background:rgba(255,255,255,.07);white-space:nowrap}
.pill.lime{background:rgba(212,255,58,.13);color:var(--lime)}
.pill.warn{background:rgba(255,201,74,.13);color:var(--warn)}
.pill.bad{background:rgba(255,107,90,.13);color:var(--bad)}

/* кнопки */
.btn{height:52px;border-radius:18px;font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;text-decoration:none}
.btn.lime{background:var(--lime);color:var(--ink)}
.btn.ghost{background:rgba(255,255,255,.10)}
.btn.dash{border:1px dashed rgba(212,255,58,.5);color:var(--lime)}
.btn.danger{background:rgba(255,107,90,.12);color:var(--bad)}
.btn.sm{height:44px;border-radius:14px;font-size:14px;width:auto;padding:0 16px}
.icon-btn{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center}

/* стеклянные блоки */
.box{border-radius:22px;padding:16px}
.box h3{margin:0 0 10px;font-size:15px;font-weight:800}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:4px 0;color:var(--muted2)}
.kv b{color:var(--text);white-space:nowrap}
.kv.total{border-top:1px solid var(--line);margin-top:4px;padding-top:9px}
.gain{display:flex;justify-content:space-between;align-items:flex-end;margin-top:10px;padding:14px;border-radius:16px;background:rgba(212,255,58,.12);border:1px solid rgba(212,255,58,.38)}
.gain .l{font-size:12px;color:#DDE5C8;font-weight:700}
.gain .v{font-family:var(--display);font-weight:800;font-size:26px;color:var(--lime)}
.gain .p{font-weight:800;color:var(--lime)}
.gain.neg{background:rgba(255,107,90,.08);border-color:rgba(255,107,90,.35)}
.gain.neg .v,.gain.neg .p{color:var(--bad)}
.foot{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.4}

/* таб-бар */
#tabs{position:absolute;left:18px;right:18px;bottom:calc(var(--bottom) + 18px);height:68px;border-radius:26px;display:flex;padding:6px;background:rgba(16,18,16,.86);-webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%);box-shadow:0 18px 50px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.12);z-index:10}
#tabs::before{content:"";position:fixed;left:0;right:0;bottom:0;height:calc(var(--bottom) + 100px);background:linear-gradient(rgba(7,8,10,0),#07080A 60%);z-index:-1;pointer-events:none}
#tabs .ind{position:absolute;top:6px;bottom:6px;left:6px;width:calc(25% - 3px);border-radius:20px;background:linear-gradient(160deg,rgba(212,255,58,.24),rgba(212,255,58,.08));border:1px solid rgba(212,255,58,.35);transition:transform .45s cubic-bezier(.2,1.25,.35,1)}
#tabs button{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#9A9F97;transition:color .3s}
#tabs button.on{color:var(--lime)}
#tabs span{font-size:11px;font-weight:700}

/* шторка */
.sheet-wrap{position:absolute;inset:0;z-index:20}
.sheet-wrap .back{position:absolute;inset:0;width:100%;background:rgba(0,0,0,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.sheet-wrap .sheet{position:absolute;left:0;right:0;bottom:0;max-height:calc(100% - var(--top) - 24px);border-radius:34px 34px 0 0;background:var(--sheet);border-top:1px solid rgba(255,255,255,.12);padding:10px 18px calc(var(--bottom) + 28px)}
.sheet-wrap .sheet.dragging{animation:none;transition:none}
.handle{width:40px;height:5px;border-radius:3px;background:rgba(255,255,255,.22);margin:0 auto 12px}
.photo{position:relative;height:250px;border-radius:24px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.photo .tag{position:absolute;left:12px;bottom:12px;font-size:12px;font-weight:700;padding:6px 10px;border-radius:10px;background:rgba(0,0,0,.5)}
.photo .fav{position:absolute;right:12px;top:12px;background:rgba(0,0,0,.45);z-index:1}
.photo.gal{height:300px;background:#0c0d0c}
.gtrack{position:absolute;inset:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.gtrack::-webkit-scrollbar{display:none}
.gslide{position:relative;flex:0 0 100%;height:100%;scroll-snap-align:center;scroll-snap-stop:always}
.photo .gslide img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.gdots{position:absolute;left:0;right:0;bottom:14px;display:flex;justify-content:center;gap:5px;pointer-events:none}
.gdots i{width:6px;height:6px;border-radius:3px;background:rgba(255,255,255,.35);transition:width .25s,background .25s}
.gdots i.on{width:16px;background:var(--lime)}
.photo .gmore{display:inline-flex;align-items:center;gap:6px;border:1px solid rgba(255,255,255,.18);color:var(--text);z-index:1;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.photo .gmore:disabled{opacity:.7}
.sbrand{font-family:var(--display);font-weight:700;font-size:22px}
.orig{margin-top:8px;font-size:13px;color:var(--muted)}
.orig summary{cursor:pointer;font-weight:700;list-style:none;display:inline-flex;align-items:center;gap:6px;min-height:32px}
.orig summary::-webkit-details-marker{display:none}
.orig p{margin:4px 0 0;color:var(--soft);line-height:1.45;word-break:break-word}
.gauge{width:78px;height:78px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center}
.gauge div{width:62px;height:62px;border-radius:50%;background:var(--sheet);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:20px}
.list{margin:6px 0 0;padding:0;list-style:none;font-size:13px;line-height:1.35;color:var(--soft)}
.list li{position:relative;padding-left:18px;margin-top:3px}
.list li::before{content:'';position:absolute;left:3px;top:6px;width:6px;height:6px;border-radius:50%;background:var(--c,var(--muted))}
.lh{font-size:12px;font-weight:800;color:var(--muted);margin-top:10px;letter-spacing:.04em;text-transform:uppercase}
.phrase{width:100%;text-align:left;padding:12px 14px;border-radius:16px;background:rgba(255,255,255,.05);border:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:44px}
.phrase b{font-size:15px;font-weight:700;display:block}
.phrase span{font-size:12px;color:var(--muted);display:block;margin-top:2px}

/* бренды */
.radar{position:relative;width:104px;height:104px;flex:none;border-radius:50%;border:1px solid rgba(212,255,58,.3);overflow:hidden}
.radar i{position:absolute;border-radius:50%;border:1px solid rgba(212,255,58,.22)}
.blist{display:flex;flex-direction:column;gap:8px}
.brow{border-radius:18px;padding:10px 8px 10px 14px;min-height:64px;display:flex;align-items:center;gap:10px;width:100%;text-align:left}
.brow .t{flex:1;min-width:0;padding:2px 0}
.brow .n{font-weight:800;font-size:15px;line-height:1.25;display:flex;gap:8px;align-items:center}
.brow .m{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tagsm{font-size:10px;font-weight:800;letter-spacing:.05em;padding:3px 6px;border-radius:6px;background:rgba(255,255,255,.08);color:var(--muted2)}
.switch{width:52px;height:32px;border-radius:999px;position:relative;background:rgba(255,255,255,.14);transition:background .25s;flex:none}
.switch::after{content:'';position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:var(--text);transition:transform .28s cubic-bezier(.2,1.2,.4,1);box-shadow:0 2px 8px rgba(0,0,0,.4)}
.switch[aria-checked="true"]{background:var(--lime)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
.swwrap{width:60px;height:44px;display:flex;align-items:center;justify-content:center;flex:none}
.field{display:flex;gap:10px}
.input{flex:1;min-width:0;height:50px;border-radius:16px;background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--text);padding:0 14px;font-size:16px;font-weight:600;outline:none}
.input:focus{border-color:rgba(212,255,58,.55)}
.input::placeholder{color:#6A6F68}
.err{color:var(--bad);font-size:13px;font-weight:700;line-height:1.4;margin-top:10px}
.label{font-size:13px;font-weight:800;color:var(--muted2);margin:16px 0 8px}

/* профиль */
.meter .bar{height:6px;border-radius:3px;background:rgba(255,255,255,.08);margin-top:6px;overflow:hidden}
.meter .bar div{height:100%;border-radius:3px;background:linear-gradient(90deg,#9BE22F,#D4FF3A);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.badge{font-size:12px;font-weight:800;color:var(--ink);background:var(--lime);padding:5px 9px;border-radius:8px;white-space:nowrap}
.seg{display:flex;padding:4px;border-radius:16px;position:relative;background:rgba(0,0,0,.38);border:1px solid rgba(255,255,255,.09);box-shadow:inset 0 1px 3px rgba(0,0,0,.45)}
.seg .ind{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/3);border-radius:12px;background:linear-gradient(160deg,rgba(212,255,58,.26),rgba(212,255,58,.10));border:1px solid rgba(212,255,58,.45);transition:transform .35s cubic-bezier(.2,1,.3,1)}
.seg.two .ind{width:calc((100% - 8px)/2)}
.seg button{flex:1;min-width:0;height:40px;position:relative;font-weight:700;font-size:13px;color:var(--muted2);background:none;border-radius:12px;white-space:nowrap;padding:0 4px}
.seg button.on{color:var(--lime)}
.nexpl{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.nrow{font-size:13px;line-height:1.45;color:var(--muted);padding:8px 10px;border-radius:12px;border:1px solid transparent;transition:background .25s,border-color .25s,color .25s}
.nrow b{color:var(--soft)}
.nrow.on{color:var(--soft);background:rgba(212,255,58,.06);border-color:rgba(212,255,58,.22)}
.nrow.on b{color:var(--lime)}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.08);font-size:20px;font-weight:700}
.stepper output{min-width:86px;text-align:center;font-family:var(--display);font-weight:700;font-size:15px}
.plan{border-radius:24px;padding:18px;background:rgba(255,255,255,.05);border:1px solid var(--line)}
.plan.cur{background:linear-gradient(160deg,rgba(212,255,58,.18),rgba(212,255,58,.04));border-color:rgba(212,255,58,.5)}
.plan .pn{font-family:var(--display);font-weight:800;font-size:20px}
.plan .pp{font-family:var(--display);font-weight:700;font-size:19px;white-space:nowrap}
.plan .per{font-size:12px;opacity:.7;font-family:'Manrope',sans-serif;font-weight:600}
.plan ul{margin:10px 0 0;padding:0;list-style:none;font-size:13px;line-height:1.45;color:var(--soft)}
.plan li{padding-left:18px;position:relative;margin-top:4px}
.plan li::before{content:'';position:absolute;left:2px;top:6px;width:8px;height:5px;border-left:2px solid var(--lime);border-bottom:2px solid var(--lime);transform:rotate(-45deg)}
.plan .btns{display:flex;gap:8px;margin-top:14px}
.plan .btns .btn{height:48px;border-radius:14px;font-size:14px}
.empty{border-radius:24px;padding:26px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty b{font-size:17px}
.full{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;padding:calc(var(--top) + 28px) 20px calc(var(--bottom) + 28px)}
.benefit{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:20px}
.benefit .ic{width:40px;height:40px;flex:none;border-radius:13px;background:rgba(212,255,58,.12);color:var(--lime);display:flex;align-items:center;justify-content:center}
.benefit b{display:block;font-size:15px}
.benefit span{font-size:13px;color:var(--muted2);line-height:1.4}
#toast{position:absolute;left:50%;top:calc(var(--top) + 14px);z-index:60;padding:12px 16px;border-radius:16px;background:rgba(28,30,28,.9);font-size:14px;font-weight:700;max-width:calc(100% - 36px);text-align:center;pointer-events:none}
.splash{position:absolute;inset:0;z-index:50;background:#050605;display:flex;flex-direction:column;align-items:center;justify-content:center}
[hidden]{display:none!important}
.sq{width:54px;height:54px;border-radius:18px;display:flex;align-items:center;justify-content:center;flex:none}
.banner{margin-top:12px;padding:11px 14px;border-radius:14px;background:rgba(255,107,90,.10);border:1px solid rgba(255,107,90,.32);color:#FFB3A8;font-size:13px;font-weight:700;display:flex;gap:8px;align-items:center}
.rng{position:relative;height:6px;border-radius:3px;background:rgba(255,255,255,.08);margin:16px 0 10px}
.rng i{position:absolute;top:0;bottom:0;border-radius:3px;background:linear-gradient(90deg,rgba(212,255,58,.35),rgba(212,255,58,.75))}
.rng b{position:absolute;top:-4px;width:4px;height:14px;border-radius:2px;background:var(--lime);box-shadow:0 0 8px rgba(212,255,58,.8);transform:translateX(-50%)}
.mline{font-size:13px;color:var(--muted2);line-height:1.5}
.mline b{color:var(--text)}
.srow{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;padding:7px 0;border-top:1px solid var(--line);font-size:13px;min-height:36px}
.srow:first-of-type{border-top:0}
.srow span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--soft)}
.srow b{white-space:nowrap}
.xbtn{font-size:12px;font-weight:800;color:var(--muted2);margin:2px 0 0 18px;min-height:28px}
.toast.long{animation-duration:4.6s}
.acc summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:32px}
.acc summary::-webkit-details-marker{display:none}
.acc summary h3{margin:0}
.acc summary>svg{transition:transform .25s;color:var(--muted);flex:none}
.acc[open] summary>svg{transform:rotate(180deg)}
</style>
</head>
<body>
<div id="stage">
  <div class="bg-glow"></div>
  <div class="bg-grid"></div>
  <div id="view" class="scroll" aria-live="polite"></div>
  <nav id="tabs" class="glass" aria-label="Разделы" hidden></nav>
  <div id="full"></div>
  <div id="sheetRoot"></div>
  <div id="toastRoot"></div>
  <div id="splash" class="splash" aria-hidden="true">
    <div class="s-glow" style="position:absolute;left:50%;top:46%;width:420px;height:420px;margin:-210px 0 0 -210px;border-radius:50%;background:radial-gradient(circle,rgba(212,255,58,.28),rgba(212,255,58,0) 62%)"></div>
    <svg width="168" height="168" viewBox="160 160 704 704" style="position:relative;margin-top:-40px">
      <g fill="none" stroke="#D4FF3A" stroke-width="34" stroke-linecap="round" stroke-linejoin="round">
        <path class="s-br s-b1" d="M212 352 V262 Q212 212 262 212 H352"/>
        <path class="s-br s-b2" style="animation-delay:.04s" d="M672 212 H762 Q812 212 812 262 V352"/>
        <path class="s-br s-b3" style="animation-delay:.08s" d="M812 672 V762 Q812 812 762 812 H672"/>
        <path class="s-br s-b4" style="animation-delay:.12s" d="M352 812 H262 Q212 812 212 762 V672"/>
      </g>
      <path class="s-h" fill="#F2F4EF" d="M402 330a52 52 0 0 1 52 52v92h116v-92a52 52 0 0 1 104 0v260a52 52 0 0 1 -104 0v-92h-116v92a52 52 0 0 1 -104 0v-260a52 52 0 0 1 52 -52z" transform="translate(-26,0)"/>
      <circle class="s-pulse" cx="700" cy="316" r="38" fill="none" stroke="#D4FF3A" stroke-width="8"/>
      <circle class="s-dot" cx="700" cy="316" r="38" fill="#D4FF3A"/>
    </svg>
    <div style="position:relative;margin-top:28px;font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:.4em;padding-left:.4em">
      <span class="s-letter" style="animation-delay:.6s">H</span><span class="s-letter" style="animation-delay:.65s">U</span><span class="s-letter" style="animation-delay:.7s">N</span><span class="s-letter" style="animation-delay:.75s">T</span><span class="s-letter" style="animation-delay:.8s">R</span><span class="s-letter" style="animation-delay:.85s;color:#D4FF3A">.</span>
    </div>
  </div>
</div>
<script>
'use strict';
const tg = window.Telegram && window.Telegram.WebApp;
const INIT = (tg && tg.initData) || '';
const REDUCED = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = id => document.getElementById(id);
const GROUPS = ['Одежда', 'Обувь', 'Сумки', 'Аксессуары'];
const PHRASES = [
  ['你好，还在吗？', 'Привет, ещё продаётся?'],
  ['可以发一下吊牌和水洗标的照片吗？', 'Можешь прислать фото бирки и тега с составом?'],
  ['可以拍一下细节吗？logo、拉链、走线和五金', 'Сними детали: логотип, молнию, швы и фурнитуру'],
  ['是正品吗？有购买凭证吗？', 'Это оригинал? Есть чек или подтверждение покупки?'],
  ['最低多少可以出？诚心要', 'За сколько минимум отдашь? Готов взять']
];
const TILES = ['radial-gradient(circle at 30% 25%,#3C4436,#121510 75%)', 'radial-gradient(circle at 30% 25%,#3A3A44,#111116 75%)',
  'radial-gradient(circle at 30% 25%,#2F3A44,#0F1418 75%)', 'radial-gradient(circle at 30% 25%,#3E3A30,#14120E 75%)',
  'radial-gradient(circle at 30% 25%,#44392C,#15110C 75%)'];
const GLYPH = {
  'Одежда': 'M8 3l4 2 4-2 5 3-2 5-2-1v11H7V10l-2 1-2-5z M12 5v15',
  'Обувь': 'M3 16v-4l5-1 3-4 3 3 4 1 3 2v3z M3 16h18 M8 11l2 2 M11 9l2 2',
  'Сумки': 'M5 8h14l-1 12H6z M9 8V6a3 3 0 0 1 6 0v2 M10 12h4',
  'Аксессуары': 'M12 12m-6 0a6 6 0 1 0 12 0a6 6 0 1 0 -12 0 M12 9v3l2 2 M9 3h6 M9 21h6',
  'Другое': 'M4 7l8-4 8 4v10l-8 4-8-4z M4 7l8 4 8-4 M12 11v10'
};
const ICON = {
  feed: 'M4 4h7v7H4z M13 4h7v7h-7z M4 13h7v7H4z M13 13h7v7h-7z',
  brands: 'M12 12m-8 0a8 8 0 1 0 16 0a8 8 0 1 0 -16 0 M12 12l5-5 M12 12m-3 0a3 3 0 1 0 6 0a3 3 0 1 0 -6 0',
  favs: 'M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z',
  profile: 'M12 12a4 4 0 1 0 0-8a4 4 0 0 0 0 8z M4 21a8 8 0 0 1 16 0',
  chat: 'M4 5h16v11H9l-5 4z', copy: 'M9 9h11v11H9z M5 15H4V4h11v1',
  bolt: 'M13 2L4 14h7l-1 8 9-12h-7z', shield: 'M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z M9 12l2 2 4-4',
  coin: 'M12 12m-8 0a8 8 0 1 0 16 0a8 8 0 1 0 -16 0 M9 9h6 M9 13h6 M12 9v8',
  list: 'M4 6h16 M4 12h16 M4 18h16',
  eyeoff: 'M3 3l18 18 M10.6 5.1A10.4 10.4 0 0 1 12 5c5 0 9 4.5 10 7-.5 1.2-1.4 2.6-2.6 3.8 M6.6 6.6C4.4 8.1 2.8 10.2 2 12c1 2.5 5 7 10 7 1.9 0 3.6-.6 5.1-1.5 M9.9 9.9a3 3 0 0 0 4.2 4.2',
  warn: 'M12 9v4 M12 17h.01 M10.3 3.9L2.4 18a2 2 0 0 0 1.7 3h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z'
};
const TABS = [['feed', 'Лента'], ['brands', 'Бренды'], ['favs', 'Избранное'], ['profile', 'Профиль']];
const LOGO = s => `<svg width="${s}" height="${s}" viewBox="160 160 704 704" aria-hidden="true"><g fill="none" stroke="#D4FF3A" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"><path d="M212 352 V262 Q212 212 262 212 H352"/><path d="M672 212 H762 Q812 212 812 262 V352"/><path d="M812 672 V762 Q812 812 762 812 H672"/><path d="M352 812 H262 Q212 812 212 762 V672"/></g><path fill="#F2F4EF" d="M402 330a52 52 0 0 1 52 52v92h116v-92a52 52 0 0 1 104 0v260a52 52 0 0 1 -104 0v-92h-116v92a52 52 0 0 1 -104 0v-260a52 52 0 0 1 52 -52z" transform="translate(-26,0)"/><circle cx="700" cy="316" r="44" fill="#D4FF3A"/></svg>`;
const svg = (d, size = 22, w = 1.8, fill = 'none') => `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="${fill}" stroke="currentColor" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="${d}"/></svg>`;

const store = {
  get(k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { window.localStorage.setItem(k, v); } catch (e) { } }
};
const S = {
  me: null, tab: 'feed', plans: null, brands: null, favs: null,
  feed: null, filter: { brand: '', group: '' }, feedLoading: false, feedSeq: 0,
  view: 'new', mode: store.get('huntr.mode') === 'grid' ? 'grid' : 'list', newTotal: null, allTotal: null,
  items: {}, istate: {}, sheet: null, settingsTimer: null, calcOpen: false, undo: null
};

/* ---------- утилиты ---------- */
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const NF = new Intl.NumberFormat('ru-RU', { maximumFractionDigits: 0 });
const num = n => NF.format(Math.round(Number(n) || 0));
const plural = (n, a, b, c) => { const m = Math.abs(n) % 100, k = m % 10; return (m > 10 && m < 20) ? c : k === 1 ? a : (k > 1 && k < 5) ? b : c; };
const dateRu = ts => new Date(ts * 1000).toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' });
const key = it => it.source + ':' + it.item_id;
const tileFor = s => TILES[Math.abs([...String(s)].reduce((a, c) => a * 31 + c.charCodeAt(0) | 0, 7)) % TILES.length];
function priceText(lo, hi) {
  if (lo != null && hi != null) return `¥${num(lo)}–${num(hi)}`;
  if (hi != null) return `до ¥${num(hi)}`;
  if (lo != null) return `от ¥${num(lo)}`;
  return 'любая цена';
}
const haptic = (kind = 'light') => { try { tg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred(kind); } catch (e) { } };
const hapticSel = () => { try { tg && tg.HapticFeedback && tg.HapticFeedback.selectionChanged(); } catch (e) { } };
const hapticNote = t => { try { tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred(t); } catch (e) { } };
function openLink(url) { if (!url) return; if (tg && tg.openLink) tg.openLink(url); else window.open(url, '_blank', 'noopener'); }

let toastTimer;
function toast(text) {
  const r = $('toastRoot');
  r.innerHTML = `<div id="toast" class="toast glass" role="status">${esc(text)}</div>`;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { r.innerHTML = ''; }, 2300);
}
function toastAction(text, label, fn) {
  const r = $('toastRoot'); S.undo = fn;
  r.innerHTML = `<div id="toast" class="toast long glass" role="status" style="pointer-events:auto;display:flex;align-items:center;gap:14px;padding:8px 10px 8px 16px">${esc(text)}<button class="press" data-act="undo" style="color:var(--lime);font-weight:800;min-height:34px;padding:0 6px">${esc(label)}</button></div>`;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { r.innerHTML = ''; S.undo = null; }, 4600);
}

class ApiErr extends Error { constructor(status, error) { super(error); this.status = status; this.error = error; } }
async function api(path, opts = {}) {
  const init = { method: opts.method || 'GET', headers: { 'X-Init-Data': INIT } };
  if (opts.keepalive) init.keepalive = true;
  if (opts.body !== undefined) { init.headers['Content-Type'] = 'application/json'; init.body = JSON.stringify(opts.body); }
  let r;
  try { r = await fetch(path, init); } catch (e) { throw new ApiErr(0, 'network'); }
  let data = null;
  try { data = await r.json(); } catch (e) { }
  if (!r.ok) {
    const err = new ApiErr(r.status, (data && data.error) || 'error');
    if (r.status === 403 && err.error === 'no_access' && S.me) { S.me.access = false; render(); }
    throw err;
  }
  return data;
}
function errText(e) {
  if (e.status === 0) return 'Нет связи. Проверь интернет';
  if (e.status === 401) return 'Сессия устарела — открой приложение заново';
  if (e.status === 429) return 'Лимит на этот месяц закончился';
  if (e.status >= 500) return 'Что-то сломалось на сервере. Попробуй ещё раз';
  return 'Не получилось. Попробуй ещё раз';
}
const fail = e => { hapticNote('error'); toast(errText(e)); };

/* ---------- загрузка ---------- */
async function loadMe() { S.me = await api('/api/me'); return S.me; }
async function loadPlans() { S.plans = await api('/api/plans'); return S.plans; }
async function loadFeed(append = false) {
  const seq = ++S.feedSeq;
  S.feedLoading = true;
  try {
    if (append && S.view === 'new') await flushSeen();
    const have = append && S.feed ? S.feed.items : [];
    // в «Новых» просмотренные уже ушли с сервера — сдвигаемся только на непросмотренные
    const offset = S.view === 'new' ? have.filter(x => !x.seen).length : have.length;
    const q = new URLSearchParams({ view: S.view, offset, limit: 30 });
    if (S.filter.brand) q.set('brand', S.filter.brand);
    if (S.filter.group) q.set('group', S.filter.group);
    const d = await api('/api/feed?' + q);
    if (seq !== S.feedSeq) return;
    d.items = d.items || [];
    if (typeof d.new_total === 'number') S.newTotal = d.new_total;
    if (typeof d.all_total === 'number') S.allTotal = d.all_total;
    else if (S.view === 'all' && !S.filter.brand && !S.filter.group && typeof d.total === 'number') S.allTotal = d.total;
    if (append && S.feed) {
      const ks = new Set(have.map(key));
      S.feed.items = have.concat(d.items.filter(x => !ks.has(key(x))));
      S.feed.total = d.total + (have.length - offset);
    } else S.feed = d;
  } finally { if (seq === S.feedSeq) S.feedLoading = false; }
}
function reloadFeed() {
  if (!S.feed) S.feed = { items: [], total: 0, facets: { brands: [], groups: [] } };
  S.feed.items = []; S.feed.total = 0; S.feedLoading = true; renderView(false);
  loadFeed().then(() => S.tab === 'feed' && renderView(false)).catch(e => { S.feedLoading = false; fail(e); if (S.tab === 'feed') renderView(false); });
}
async function loadBrands() { S.brands = await api('/api/brands'); }
async function loadFavs() { S.favs = await api('/api/favorites'); }

async function refreshTab(tab) {
  try {
    if (tab === 'feed') { const p = loadFeed(); loadMe().then(() => S.tab === 'feed' && renderHead()).catch(() => { }); await p; }
    else if (tab === 'brands') await loadBrands();
    else if (tab === 'favs') await loadFavs();
    else if (tab === 'profile') await Promise.all([loadMe(), loadPlans()]);
  } catch (e) { if (e.status !== 403) fail(e); }
  if (S.tab === tab && S.me && S.me.access) renderView(false);
}

/* ---------- общий каркас ---------- */
function render() {
  const full = $('full');
  if (!INIT) { full.innerHTML = noTelegram(); $('tabs').hidden = true; $('view').innerHTML = ''; return; }
  if (!S.me) return;
  if (!S.me.access) {
    $('tabs').hidden = true; $('view').innerHTML = '';
    full.innerHTML = paywall();
    if (!S.plans) loadPlans().then(() => { if (!S.me.access) full.innerHTML = paywall(); }).catch(fail);
    return;
  }
  full.innerHTML = '';
  renderTabs();
  renderView(true);
}
function renderTabs() {
  const nav = $('tabs'); nav.hidden = false;
  const i = TABS.findIndex(t => t[0] === S.tab);
  nav.innerHTML = `<div class="ind" style="transform:translateX(calc(${i} * 100%))"></div>` +
    TABS.map(([id, label]) => `<button class="press${S.tab === id ? ' on' : ''}" data-act="tab" data-tab="${id}" aria-label="${label}"${S.tab === id ? ' aria-current="page"' : ''}>${svg(ICON[id])}<span>${label}</span></button>`).join('');
}
function renderView(animate) {
  const v = $('view');
  const html = S.tab === 'feed' ? feedScreen() : S.tab === 'brands' ? brandsScreen() : S.tab === 'favs' ? favsScreen() : profileScreen();
  v.innerHTML = `<div class="col main${animate ? ' screen' : ''}">${html}</div>`;
  observeCards();
}
function renderQuiet() { renderView(false); $('view').querySelectorAll('.rise').forEach(e => e.classList.remove('rise')); }
function goTab(tab) {
  flushSeen();
  if (S.tab === tab) { $('view').scrollTo({ top: 0, behavior: REDUCED ? 'auto' : 'smooth' }); refreshTab(tab); return; }
  S.tab = tab; renderTabs(); renderView(true); $('view').scrollTop = 0; refreshTab(tab);
}

/* ---------- лента ---------- */
function skeletonCards(n) {
  return `<div class="flist">${Array.from({ length: n }, () => `<div class="card glass" aria-hidden="true"><div class="thumb skel"></div><div class="cbody"><div class="skel" style="height:14px;width:50%;border-radius:6px"></div><div class="skel" style="height:11px;width:80%;border-radius:6px;margin-top:9px"></div><div class="skel" style="height:16px;width:42%;border-radius:6px;margin-top:12px"></div></div></div>`).join('')}</div>`;
}
const newCount = () => S.newTotal != null ? S.newTotal : ((S.me && S.me.counts && S.me.counts.feed_new) || 0);
function fsumHTML() {
  const n = newCount();
  return `<b>${num(n)}</b> ${plural(n, 'новая', 'новых', 'новых')}${S.allTotal != null ? ` · ${num(S.allTotal)} за 3 дня` : ''}`;
}
function headHTML() {
  const me = S.me, on = !me.paused, all = S.view === 'all';
  return `<div class="between rise"><div class="logo">${LOGO(28)}<b>HUNTR</b></div>
    <div class="livepill glass"><span class="dot live${on ? '' : ' off'}"></span>${on ? 'Радар активен' : 'На паузе'}</div></div>
    <div class="fsum rise" id="fsum" style="animation-delay:40ms">${fsumHTML()}</div>

const dayKey = ts => { const d = new Date(ts * 1000); return d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate(); };

/* ---------- просмотренные ---------- */
// Карточка считается просмотренной, когда ≥60% видно 800 мс. Отправляем пачкой не чаще раза в 2 с.
const SEEN = { q: new Map(), timer: null, last: 0, obs: null, wait: new Map() };
function seenObs() {
  if (!SEEN.obs && 'IntersectionObserver' in window) SEEN.obs = new IntersectionObserver(es => es.forEach(e => {
    const k = e.target.dataset.key;
    if (e.isIntersecting && e.intersectionRatio >= 0.6) { if (!SEEN.wait.has(k)) SEEN.wait.set(k, setTimeout(() => { SEEN.wait.delete(k); markSeen(k); }, 800)); }
    else { clearTimeout(SEEN.wait.get(k)); SEEN.wait.delete(k); }
  }), { root: $('view'), rootMargin: '0px 0px -90px 0px', threshold: [0, 0.6] });
  return SEEN.obs;
}
function observeCards() {
  SEEN.wait.forEach(clearTimeout); SEEN.wait.clear();
  const o = seenObs(); if (!o) return;
  o.disconnect();
  if (S.tab === 'feed') document.querySelectorAll('#view [data-unseen]').forEach(el => o.observe(el));
}
function markSeen(k) {
  const it = S.items[k]; if (!it || it.seen) return;
  it.seen = true;
  if (S.feed) S.feed.items.forEach(x => { if (key(x) === k) x.seen = true; });
  document.querySelectorAll(`#view [data-unseen][data-key="${CSS.escape(k)}"]`).forEach(el => {
    el.removeAttribute('data-unseen'); if (SEEN.obs) SEEN.obs.unobserve(el);
    const d = el.querySelector('.udot'); if (d) d.classList.add('out');
  });
  SEEN.q.set(k, { source: it.source, item_id: it.item_id });
  if (!SEEN.timer) SEEN.timer = setTimeout(flushSeen, Math.max(0, 2000 - (Date.now() - SEEN.last)));
}
async function flushSeen(beacon) {
  clearTimeout(SEEN.timer); SEEN.timer = null;
  if (!SEEN.q.size) return;
  const items = [...SEEN.q.values()]; SEEN.q.clear(); SEEN.last = Date.now();
  try { const r = await api('/api/seen', { method: 'POST', body: { items }, keepalive: !!beacon }); setNewTotal(r && r.new_total); }
  catch (e) { items.forEach(x => { if (!SEEN.q.has(key(x))) SEEN.q.set(key(x), x); }); }
}

/* ---------- скрыть ---------- */
function collapse(el) {
  const sec = el.closest('.dsec'), grid = el.classList.contains('gcard');
  const done = () => { el.remove(); if (sec && !sec.querySelector('[data-act="item"]')) sec.remove(); };
  if (REDUCED || !el.animate) return done();
  const h = el.offsetHeight;
  el.style.pointerEvents = 'none'; el.style.overflow = 'hidden';
  el.animate([{ opacity: 1, transform: 'none', height: h + 'px' }, { opacity: 0, transform: 'scale(.94)', height: (grid ? h : 0) + 'px', marginBottom: grid ? '0px' : '-8px', paddingTop: grid ? '6px' : '0px', paddingBottom: grid ? '6px' : '0px' }],
    { duration: 280, easing: 'cubic-bezier(.4,0,.2,1)' }).onfinish = done;
}
async function hideItem(k) {
  const it = S.items[k]; if (!it) return;
  closeSheet();
  const fi = S.feed ? S.feed.items.findIndex(x => key(x) === k) : -1;
  const fitem = fi >= 0 ? S.feed.items[fi] : it;
  const putBack = () => { if (fi >= 0 && S.feed && !S.feed.items.some(x => key(x) === k)) { S.feed.items.splice(Math.min(fi, S.feed.items.length), 0, fitem); S.feed.total++; } if (S.tab === 'feed') renderQuiet(); };
  if (fi >= 0) { S.feed.items.splice(fi, 1); S.feed.total = Math.max(0, S.feed.total - 1); }
  if (S.tab === 'feed') document.querySelectorAll(`#view [data-act="item"][data-key="${CSS.escape(k)}"]`).forEach(collapse);
  const body = { source: it.source, item_id: it.item_id };
  try {
    const r = await api('/api/hide', { method: 'POST', body: Object.assign({}, body, { hidden: true }) });
    hapticNote('success'); setNewTotal(r && r.new_total);
    toastAction('Скрыто', 'Вернуть', async () => {
      try {
        const r2 = await api('/api/hide', { method: 'POST', body: Object.assign({}, body, { hidden: false }) });
        setNewTotal(r2 && r2.new_total); putBack(); hapticNote('success'); toast('Вернул в ленту');

function bindDrag(el) {
  let y0 = null, dy = 0;
  el.addEventListener('touchstart', e => { if (el.scrollTop <= 0) { y0 = e.touches[0].clientY; dy = 0; } }, { passive: true });
  el.addEventListener('touchmove', e => {
    if (y0 == null) return; dy = e.touches[0].clientY - y0;
    if (dy > 0) { el.classList.add('dragging'); el.style.transform = `translateY(${dy}px)`; } else { el.style.transform = ''; }
  }, { passive: true });
  el.addEventListener('touchend', () => {
    if (y0 == null) return; y0 = null; el.classList.remove('dragging');
    if (dy > 120) { el.style.transition = 'transform .22s ease'; el.style.transform = 'translateY(100%)'; closeSheet(); }
    else { el.style.transition = 'transform .3s cubic-bezier(.2,1.2,.4,1)'; el.style.transform = ''; setTimeout(() => { el.style.transition = ''; }, 320); }

  const head = `<h1 class="h1">Избранное</h1>`;

  if (!f.items.length) return head + `<div class="empty glass rise"><div style="color:var(--lime)">${svg(ICON.favs, 36, 1.4)}</div><b>Пока пусто</b><div class="txt">Нажми ☆ в карточке вещи — она сохранится здесь, даже когда уйдёт из ленты.</div><button class="btn sm ghost press" data-act="tab" data-tab="feed">В ленту</button></div>`;
  return head + `<div class="txt">Отложенные вещи: ${num(f.items.length)}. Открой, чтобы посчитать выгоду или сделать легит-чек.</div>` + itemsHTML(f.items, 0, {});
}

/* ---------- профиль и тарифы ---------- */
function meter(label, left, total, used) {
  const pct = total ? Math.max(0, Math.min(100, (used ? left : (total - left)) / total * 100)) : 0;
  const value = used ? `${num(left)} / ${num(total)}` : `осталось ${num(left)} из ${num(total)}`;
  return `<div class="meter"><div class="between" style="font-size:13px"><span style="color:var(--muted2)">${label}</span><b style="font-weight:700">${value}</b></div><div class="bar"><div style="width:${used ? pct : 100 - pct}%"></div></div></div>`;
}
function planCards() {
  const P = S.plans;
  if (!P) return '<div class="glass skel" style="height:190px;border-radius:24px"></div>'.repeat(2);
  const me = S.me, cur = me.access ? me.plan.code : null;
  return P.plans.map((p, i) => {
    const isCur = p.code === cur, soldOut = p.seats_left === 0;
    let btns;
    if (!P.payments_enabled) btns = `<div class="foot">Оплата временно недоступна — загляни чуть позже.</div>`;
    else if (soldOut && !isCur) btns = `<div class="btns"><button class="btn ghost" disabled>Мест нет</button></div>`;
    else btns = `<div class="btns"><button class="btn ${isCur ? 'ghost' : 'lime'} press" data-act="buy" data-plan="${p.code}" data-m="1">${isCur ? 'Продлить · ' : ''}Месяц ⭐</button>${p.quarter_stars ? `<button class="btn ghost press" data-act="buy" data-plan="${p.code}" data-m="3">3 месяца ⭐</button>` : ''}</div>
      ${p.quarter_stars ? `<div class="foot" style="margin-top:8px">3 месяца — ${num(p.quarter_stars)} ⭐ разом, выгоднее на 15%</div>` : ''}`;
    return `<div class="plan rise${isCur ? ' cur' : ''}" style="animation-delay:${60 + i * 70}ms">
      <div class="between" style="align-items:baseline"><div class="row"><div class="pn">${esc(p.title)}</div>${isCur ? '<span class="badge">ТВОЙ</span>' : ''}</div>
        <div style="text-align:right"><div class="pp">${num(p.price_stars)} ⭐<span class="per">/мес</span></div><div class="sub" style="font-size:12px">≈ ${num(p.price_stars * P.star_rub)} ₽</div></div></div>
      ${p.tagline ? `<div style="font-size:13px;margin-top:6px;color:var(--muted2)">${esc(p.tagline)}</div>` : ''}
      <ul>${p.perks.map(x => `<li>${esc(x)}</li>`).join('')}</ul>
      ${p.seats_left != null ? `<div class="pill ${soldOut ? 'bad' : 'lime'}" style="display:inline-block;margin-top:12px">${soldOut ? 'Все места заняты' : `Осталось мест: ${p.seats_left} из ${p.seats}`}</div>` : ''}
      ${btns}</div>`;
  }).join('');
}
function profileScreen() {
  const me = S.me, p = me.plan, s = me.settings;
  const modes = [['digest', 'Сводкой'], ['instant', 'Сразу'], ['off', 'Только лента']];
  const mi = Math.max(0, modes.findIndex(m => m[0] === s.notify));
  const badge = me.admin ? 'АДМИН' : p.code === 'trial' ? 'ПРОБНЫЙ' : 'АКТИВЕН';
  return `<div><div class="sub">Привет, ${esc(me.user.first_name || 'охотник')}</div><h1 class="h1" style="margin-top:4px">Профиль</h1></div>
    <div class="glass rise" style="border-radius:26px;padding:18px;display:flex;flex-direction:column;gap:12px">
      <div class="between"><div style="font-weight:800;font-size:18px">${esc(p.title)}${p.until ? ' · до ' + dateRu(p.until) : ''}</div><div class="badge">${badge}</div></div>
      ${meter('Бренды', me.counts.brands, p.brands, true)}
      ${meter('Легит-чеки', p.legit_left, p.legit_checks)}
      ${meter('Сравнения с Авито', p.price_left, p.price_checks)}
    </div>
    <div class="glass box rise" style="animation-delay:60ms"><h3>Уведомления в боте</h3>
      <div class="seg" role="radiogroup" aria-label="Как присылать находки"><div class="ind" style="transform:translateX(${mi * 100}%)"></div>
        ${modes.map(([v, l]) => `<button class="press${s.notify === v ? ' on' : ''}" role="radio" aria-checked="${s.notify === v}" data-act="notify" data-v="${v}">${l}</button>`).join('')}</div>
      ${s.notify === 'digest' ? `<div class="label" style="margin-top:14px">Сводка раз в</div><div class="wrapchips">${[15, 30, 60, 180].map(n => `<button class="chip press${s.every === n ? ' on' : ''}" data-act="every" data-v="${n}">${n < 60 ? n + ' мин' : n / 60 + ' ч'}</button>`).join('')}</div>` : ''}
      <div class="nexpl">${[
        ['digest', 'Сводкой', `раз в ${s.every || 30} мин приходит одно сообщение: «12 новых · LV 5 · Gucci 4». Листаешь находки прямо в нём. Лучший вариант, если брендов много.`],
        ['instant', 'Сразу', 'каждая находка приходит отдельным сообщением в ту же минуту, как радар её поймал. Быстрее всех, но сообщений много.'],
        ['off', 'Только лента', 'в чат ничего не приходит. Все находки копятся здесь, во вкладке «Лента» — смотришь, когда удобно.'],
      ].map(([v, t, d]) => `<div class="nrow${s.notify === v ? ' on' : ''}"><b>${t}</b> — ${d}</div>`).join('')}</div>
      <div class="between" style="margin-top:12px"><div><div style="font-weight:700">Тихие часы</div><div class="sub" style="font-weight:500">00:00–08:00 без звука</div></div><div class="swwrap"><button class="switch press" role="switch" aria-checked="${!!s.quiet}" aria-label="Тихие часы" data-act="quiet"></button></div></div>
      <div class="between" style="margin-top:4px"><div><div style="font-weight:700">Пауза радара</div><div class="sub" style="font-weight:500">Не искать новые вещи</div></div><div class="swwrap"><button class="switch press" role="switch" aria-checked="${!!me.paused}" aria-label="Пауза радара" data-act="pause"></button></div></div>
    </div>
    <details class="glass box rise acc" id="calcAcc" style="animation-delay:120ms"${S.calcOpen ? ' open' : ''}>
      <summary><div style="min-width:0"><h3>Калькулятор выгоды</h3><div class="sub" id="calcSum" style="font-weight:500;margin-top:3px">${calcSum(s)}</div></div>${svg('M6 9l6 6 6-6', 18)}</summary>
      <div class="txt" style="margin-top:10px">Твои цифры для расчёта себестоимости.</div>
      <div class="between" style="margin-top:12px"><span style="font-weight:700">Доставка, ₽/кг</span><div class="stepper"><button class="press" data-act="step" data-f="delivery" data-d="-100" aria-label="Меньше">−</button><output id="o-delivery">${num(s.delivery)}</output><button class="press" data-act="step" data-f="delivery" data-d="100" aria-label="Больше">+</button></div></div>
      <div class="between" style="margin-top:8px"><span style="font-weight:700">Байер, %</span><div class="stepper"><button class="press" data-act="step" data-f="fee" data-d="-1" aria-label="Меньше">−</button><output id="o-fee">${String(s.fee).replace('.', ',')}</output><button class="press" data-act="step" data-f="fee" data-d="1" aria-label="Больше">+</button></div></div>
      <div class="foot">Курс: ¥1 ≈ ${String((+me.rate).toFixed(2)).replace('.', ',')} ₽</div>
    </details>
    <h2 class="h1" style="font-size:22px;margin-top:8px">Тарифы</h2>
    ${planCards()}
    <div class="foot" style="text-align:center">Оплата звёздами Telegram. Месяц продлевается сам, отменить можно в настройках Telegram.</div>`;
}
const calcSum = s => `Доставка ${num(s.delivery)} ₽/кг · байер ${String(s.fee).replace('.', ',')}%`;
function saveSettings(patch, rerender = true) {
  Object.assign(S.me.settings, patch);
  if (rerender) renderView(false);
  clearTimeout(S.settingsTimer);
  const body = Object.assign({}, S.pendingSettings || {}, patch); S.pendingSettings = body;
  S.settingsTimer = setTimeout(async () => {
    S.pendingSettings = null;
    try { const r = await api('/api/settings', { method: 'POST', body }); S.me.settings = r.settings; S.me.paused = r.paused; }
    catch (e) { fail(e); refreshTab('profile'); }
  }, 450);
}
async function buyOwn(el) {
  el.disabled = true;
  try {
    const { link } = await api('/api/own_invoice', { method: 'POST', body: {} });
    if (tg && tg.openInvoice) {
      tg.openInvoice(link, status => {
        if (status === 'paid') {
          hapticNote('success'); toast('Готово — место для своего бренда добавлено');
          setTimeout(async () => { try { await loadBrands(); closeSheet(); render(); } catch (e) { } }, 1200);
        } else if (status === 'failed') toast('Оплата не прошла');
      });
    } else openLink(link);
  } catch (e) {
    toast(e.error === 'payments_off' ? 'Оплата временно недоступна' : e.status === 409 ? 'Докупить можно к платному тарифу' : errText(e));
  } finally { el.disabled = false; }
}
async function buy(el) {
  const plan = el.dataset.plan, months = +el.dataset.m;
  el.disabled = true;
  try {
    const { link } = await api('/api/invoice', { method: 'POST', body: { plan, months } });
    if (tg && tg.openInvoice) {
      tg.openInvoice(link, async status => {
        if (status === 'paid') {
          hapticNote('success'); toast('Оплата прошла — тариф уже работает');
          setTimeout(async () => { try { await Promise.all([loadMe(), loadPlans()]); render(); } catch (e) { } }, 1200);
        } else if (status === 'failed') toast('Оплата не прошла');
      });
    } else openLink(link);
  } catch (e) {
    toast(e.status === 409 ? 'Места на этом тарифе закончились' : e.error === 'payments_off' ? 'Оплата временно недоступна' : errText(e));
  } finally { el.disabled = false; }
}

/* ---------- пейвол и заглушки ---------- */
function paywall() {
  const me = S.me;
  const B = [[ICON.bolt, 'Первым видишь новые вещи', 'Радар проверяет Goofish каждые 10–30 минут и сразу присылает находки.'],
    [ICON.shield, 'Без подделок', 'Отсекаем копии по словам-маркерам, а ИИ оценивает фото бирок и швов.'],
    [ICON.coin, 'Сразу видна выгода', 'Себестоимость с доставкой и байером против медианы на Авито.']];
  return `<div class="full scroll" style="background:var(--bg)"><div class="bg-glow"></div><div class="bg-grid"></div>
    <div class="col screen" style="position:relative;gap:18px">
      <div class="logo">${LOGO(34)}<b>HUNTR</b></div>
      <div class="hero" style="font-size:31px">Охота на люкс<br><span>с Goofish</span></div>
      <div class="txt" style="margin-top:-6px">Новые объявления выбранных брендов — раньше других перекупщиков.</div>
      ${B.map((b, i) => `<div class="benefit glass rise" style="animation-delay:${80 + i * 70}ms"><div class="ic">${svg(b[0], 22)}</div><div><b>${b[1]}</b><span>${b[2]}</span></div></div>`).join('')}
      ${me.trial_available ? `<button class="btn lime press rise" style="height:58px;font-size:16px;animation-delay:300ms" data-act="trial">Попробовать ${me.trial_days || 3} ${plural(me.trial_days || 3, 'день', 'дня', 'дней')} бесплатно</button><div class="foot" style="text-align:center;margin-top:-8px">Без карты и автосписаний</div>`
      : `<div class="glass box"><b>Пробный период уже был</b><div class="txt" style="margin-top:4px">Выбери тариф — радар продолжит с того же места.</div></div>`}
      <h2 class="h1" style="font-size:22px;margin-top:6px">Тарифы</h2>
      ${planCards()}
    </div></div>`;
}
function noTelegram() {
  return `<div class="full" style="align-items:center;justify-content:center;text-align:center;gap:16px;background:var(--bg)"><div class="bg-glow"></div><div class="bg-grid"></div>
    <div class="col screen" style="align-items:center;position:relative">${LOGO(96)}
      <div class="hero" style="font-size:26px">Открой HUNTR<br><span>в Telegram</span></div>
      <div class="txt" style="max-width:290px">Мини-приложение работает только внутри Telegram: найди бота и нажми кнопку «Открыть».</div></div></div>`;
}
function errorScreen(e) {
  $('full').innerHTML = `<div class="full" style="align-items:center;justify-content:center;text-align:center;background:var(--bg)"><div class="col screen" style="align-items:center">${LOGO(72)}
    <div style="font-weight:800;font-size:19px">${e.status === 401 ? 'Сессия устарела' : 'Не удалось загрузиться'}</div>
    <div class="txt" style="max-width:280px">${e.status === 401 ? 'Закрой приложение и открой его заново из бота.' : esc(errText(e))}</div>
    ${e.status === 401 ? '' : '<button class="btn sm lime press" data-act="retry">Повторить</button>'}</div></div>`;
}

/* ---------- действия ---------- */
const ACT = {
  tab: el => { if (S.undo) { S.undo = null; clearTimeout(toastTimer); $('toastRoot').innerHTML = ''; } goTab(el.dataset.tab); },
  filter: el => {
    const kind = el.dataset.kind, val = el.dataset.val;
    S.filter = { brand: kind === 'brand' ? val : '', group: kind === 'group' ? val : '' };
    hapticSel(); reloadFeed();
  },
  view: el => { const v = el.dataset.v; if (v === S.view) return; hapticSel(); flushSeen(); S.view = v; $('view').scrollTop = 0; reloadFeed(); },
  mode: () => { S.mode = S.mode === 'grid' ? 'list' : 'grid'; store.set('huntr.mode', S.mode); renderView(false); },
  markAll: async el => {
    el.disabled = true;
    try {
      const r = await api('/api/seen', { method: 'POST', body: { all: true } });
      SEEN.q.clear(); if (S.feed) S.feed.items.forEach(x => { x.seen = true; }); Object.values(S.items).forEach(x => { x.seen = true; });
      document.querySelectorAll('#view [data-unseen]').forEach(x => { x.removeAttribute('data-unseen'); const d = x.querySelector('.udot'); if (d) d.classList.add('out'); });
      observeCards(); setNewTotal(r && typeof r.new_total === 'number' ? r.new_total : 0);
      hapticNote('success'); toast('Готово — всё просмотрено');
    } catch (e) { el.disabled = false; fail(e); }
  },
  hide: el => hideItem(el.dataset.key),
  undo: () => { const f = S.undo; S.undo = null; clearTimeout(toastTimer); $('toastRoot').innerHTML = ''; if (f) f(); },
  moreList: el => { const ul = el.previousElementSibling; if (ul) ul.querySelectorAll('li[hidden]').forEach(x => { x.hidden = false; }); el.remove(); },
  more: async el => { el.disabled = true; el.textContent = 'Загружаю…'; try { await loadFeed(true); } catch (e) { fail(e); } renderView(false); },
  item: el => { const k = el.dataset.key; openItem(k); S.sheet.key = k; const it = S.items[k]; if (S.tab === 'feed' && it && isUnseen(it, { feed: true })) markSeen(k); },
  closeSheet: () => closeSheet(),
  fav: el => toggleFav(el.dataset.key),
  open: el => { const it = S.items[el.dataset.key]; openLink(it && it.url); },
  link: el => openLink(el.dataset.url),
  profit: el => runProfit(el.dataset.key),
  legit: el => runLegit(el.dataset.key),
  photos: el => loadPhotos(el.dataset.key),
  phrases: el => { const st = ist(el.dataset.key); st.phrases = !st.phrases; el.setAttribute('aria-expanded', st.phrases); $('phrasesBox').innerHTML = st.phrases ? phrasesHTML() : ''; if (st.phrases) $('phrasesBox').scrollIntoView({ behavior: REDUCED ? 'auto' : 'smooth', block: 'nearest' }); },
  copy: async el => { const p = PHRASES[+el.dataset.i]; await copyText(p[0]); hapticNote('success'); toast(p[0] + ' — скопировано'); },
  toPlans: () => { closeSheet(); goTab('profile'); setTimeout(() => { const h = [...document.querySelectorAll('#view h2')].pop(); if (h) h.scrollIntoView({ behavior: REDUCED ? 'auto' : 'smooth' }); }, 450); },
  toggleBrand: el => toggleBrand(el),
  editBrand: el => { const id = +el.dataset.id; if (S.sheet && S.sheet.name === 'brand') setSheet(editBrandSheet(id)); else openSheet(editBrandSheet(id), 'brand'); },
  askDel: el => { setSheet(editBrandSheet(+el.dataset.id, true)); haptic('medium'); },
  delBrand: el => delBrand(el),
  saveBrand: el => saveBrand(el),
  addBrand: () => { if (S.sheet && S.sheet.name === 'add') setSheet(addSheetPick()); else openSheet(addSheetPick(), 'add'); },
  pickBrand: el => { hapticSel(); S.addKey = el.dataset.key; setSheet(addSheetBudget(el.dataset.title)); },
  pickOwn: () => { const v = ($('ownBrand').value || '').trim(); if (!v) { showSheetErr('Напиши название бренда'); return; } S.addKey = v; setSheet(addSheetBudget(v)); },
  preset: el => {
    hapticSel(); const p = S.brands.presets[+el.dataset.i];
    el.parentNode.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c === el));
    $('pmin').value = p.min != null ? p.min : ''; $('pmax').value = p.max != null ? p.max : '';
  },
  submitBrand: el => submitBrand(el),
  notify: el => { hapticSel(); saveSettings({ notify: el.dataset.v }); },
  every: el => { hapticSel(); saveSettings({ every: +el.dataset.v }); },
  quiet: el => { const v = el.getAttribute('aria-checked') !== 'true'; el.setAttribute('aria-checked', v); saveSettings({ quiet: v }, false); },
  pause: el => {
    const v = el.getAttribute('aria-checked') !== 'true'; el.setAttribute('aria-checked', v); S.me.paused = v;
    toast(v ? 'Радар на паузе' : 'Радар снова ищет'); saveSettings({ paused: v }, false);
  },
  step: el => {
    const f = el.dataset.f, d = +el.dataset.d, s = S.me.settings;
    const lim = f === 'delivery' ? [0, 5000] : [0, 30];
    const v = Math.max(lim[0], Math.min(lim[1], Math.round((+s[f] + d) * 10) / 10));
    if (v === +s[f]) return;
    hapticSel(); $('o-' + f).textContent = f === 'delivery' ? num(v) : String(v).replace('.', ',');
    S.istate = {}; saveSettings({ [f]: v }, false);
    const cs = $('calcSum'); if (cs) cs.textContent = calcSum(S.me.settings);
  },
  buy: el => buy(el),
  buyOwn: el => buyOwn(el),
  trial: async el => {
    el.disabled = true;
    try { await api('/api/trial', { method: 'POST', body: {} }); hapticNote('success'); await loadMe(); S.tab = 'brands'; render(); refreshTab('brands'); toast('Пробный период включён — выбери бренды'); }
    catch (e) { el.disabled = false; toast(e.status === 409 ? 'Пробный период уже был' : errText(e)); }
  },
  retry: () => boot(true)
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act]; if (!fn) return;
  if (!['filter', 'preset', 'notify', 'every', 'step', 'pickBrand'].includes(el.dataset.act)) haptic();
  fn(el, e);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.sheet) closeSheet(); if (e.key === 'Enter' && e.target.id === 'ownBrand') ACT.pickOwn(); });
document.addEventListener('visibilitychange', () => { if (document.hidden) { flushSeen(true); return; } if (S.me && S.me.access) refreshTab(S.tab); });
document.addEventListener('toggle', e => { if (e.target && e.target.id === 'calcAcc') S.calcOpen = e.target.open; }, true);

/* ---------- старт ---------- */
async function boot(again) {
  const splash = $('splash');
  const t0 = Date.now();
  let err = null;
  if (INIT) {
    try { await loadMe(); if (S.me.access) await loadFeed().catch(() => { }); } catch (e) { err = e; }
  }
  const wait = again || REDUCED ? 0 : Math.max(0, 1150 - (Date.now() - t0));
  setTimeout(() => {
    if (err) errorScreen(err); else render();
    if (splash) {
      if (REDUCED) splash.remove();
      else { splash.classList.add('exit'); setTimeout(() => splash.remove(), 450); }
    }
  }, wait);
}
if (tg) {
  try {
    tg.ready(); tg.expand();
    tg.setHeaderColor && tg.setHeaderColor('#07080A');
    tg.setBackgroundColor && tg.setBackgroundColor('#07080A');
    tg.BackButton && tg.BackButton.onClick(() => closeSheet());
  } catch (e) { }
}
if (REDUCED) { const sp = $('splash'); if (sp) sp.style.display = 'none'; }
boot(false);
</script>
</body>
</html>
